
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ONL1NE KEYBOARD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px;border-bottom:1px solid #ed1738}
h1{letter-spacing:3px}
h1 span{color:#ed1738}
main{max-width:600px;margin:auto;padding:16px}
.card{background:#17171b;border:1px solid #393039;border-radius:15px;padding:18px;margin:15px 0}
h2{color:#ed1738}
p{color:#bbb;line-height:1.5}
.keyrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #333}
input{width:100%;padding:12px;background:#090909;color:white;border:1px solid #ed1738;border-radius:8px;text-align:center}
button{background:#ed1738;color:white;border:0;padding:13px;border-radius:9px;font-weight:bold;margin:5px 3px}
.secondary{background:#333}
.status{color:#55df91}
</style>
</head>
<body>
<header>
<h1>ONL<span>1</span>NE KEYBOARD</h1>
<p>CONFIGURAÇÃO DE TECLADO</p>
</header>
<main>
<div class="card">
<h2>Meu teclado Bluetooth</h2>
<p>Personalize suas teclas de referência para jogar.</p>
<div id="keys"></div>
<button id="save">SALVAR CONFIGURAÇÃO</button>
<button class="secondary" id="reset">RESTAURAR PADRÃO</button>
<p id="status" class="status"></p>
</div>
<div class="card">
<h2>Informações</h2>
<p>As teclas abaixo são apenas um mapa de referência. O funcionamento no Free Fire depende da compatibilidade do jogo e do iPhone com teclado externo.</p>
</div>
</main>
<script>
(function(){
const defaults={
'Frente':'W',
'Trás':'S',
'Esquerda':'A',
'Direita':'D',
'Pular':'ESPAÇO',
'Agachar':'C',
'Correr':'SHIFT',
'Atirar':'J',
'Mirar':'K',
'Recarregar':'R',
'Trocar arma':'Q',
'Parede de gel':'G'
};
const storageKey='onl1ne_keyboard';
const box=document.getElementById('keys');
const status=document.getElementById('status');

function load(){
try{
return JSON.parse(localStorage.getItem(storageKey))||defaults;
}catch(e){
return defaults;
}
}

function render(values){
box.innerHTML=Object.keys(defaults).map(action=>
'<div class="keyrow"><label>'+action+'</label>'+
'<input type="text" maxlength="12" data-action="'+action+'"></div>'
).join('');
box.querySelectorAll('input').forEach(input=>{
input.value=values[input.dataset.action]||defaults[input.dataset.action];
});
}

document.getElementById('save').addEventListener('click',()=>{
const values={};
box.querySelectorAll('input').forEach(input=>{
values[input.dataset.action]=input.value.trim().toUpperCase()||defaults[input.dataset.action];
});
localStorage.setItem(storageKey,JSON.stringify(values));
status.textContent='Configuração salva com sucesso!';
});

document.getElementById('reset').addEventListener('click',()=>{
render(defaults);
localStorage.setItem(storageKey,JSON.stringify(defaults));
status.textContent='Teclas padrão restauradas!';
});

render(load());
})();
</script>
</body>
</html>
