
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ONL1NE 3D</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;overflow:hidden;background:#102a2c;color:white;font-family:Arial}
#game{position:fixed;inset:0}
#menu{position:fixed;inset:0;z-index:5;background:linear-gradient(140deg,#102b2a,#07151c);display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:55px;letter-spacing:5px;color:#e9d36c}
.players{display:flex;gap:15px}
.pick{background:#243c3a;color:white;border:2px solid #779b80;border-radius:12px;padding:18px;font-size:19px}
.pick.active{border-color:#ffe36c}
#start{margin-top:25px;padding:16px 40px;background:#e8cf55;border:0;border-radius:10px;font-weight:bold;font-size:18px}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;background:#07191bc9;padding:9px;border-radius:8px}
#score{top:10px;left:50%;transform:translateX(-50%)}
#ammo{bottom:145px;right:15px;font-size:18px}
#weapon{bottom:12px;left:50%;transform:translateX(-50%)}
#health{bottom:58px;left:50%;transform:translateX(-50%)}
#joy{position:absolute;pointer-events:auto;bottom:22px;left:22px;width:125px;height:125px;border-radius:50%;border:2px solid #ffffff88;background:#ffffff22}
#stick{position:absolute;width:43px;height:43px;left:39px;top:39px;background:white;border-radius:50%}
.btn{position:absolute;pointer-events:auto;border:1px solid #ffffff99;border-radius:50%;background:#183c42dd;color:white;width:60px;height:60px;font-weight:bold;font-size:12px}
#fire{right:20px;bottom:95px;width:78px;height:78px;background:#9b342c}
#jump{right:25px;bottom:20px}
#crouch{right:95px;bottom:20px}
#reload{right:100px;bottom:100px}
#aim{right:105px;bottom:175px}
#switch{left:160px;bottom:35px;border-radius:10px}
#edit{position:absolute;pointer-events:auto;right:10px;top:10px;padding:9px;background:#203b40;color:white;border:0;border-radius:7px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px}
.editing .btn{outline:2px dashed yellow}
</style>
</head>
<body>
<div id="game"></div>

<div id="menu">
<h1>ONL1NE</h1>
<p>ILHA ESMERALDA</p>
<p>ESCOLHA SEU PERSONAGEM</p>
<div class="players">
<button class="pick active" data-char="ONL1NE">👨🏻<br>ONL1NE</button>
<button class="pick" data-char="MIKA">👩🏻<br>MIKA</button>
</div>
<button id="start">ENTRAR NA ILHA</button>
<p>Protótipo 3D para celular</p>
</div>

<div id="hud">
<div id="score" class="panel">🔵 0 &nbsp; 05:00 &nbsp; 🔴 0</div>
<div id="ammo" class="panel">30 / 120</div>
<div id="weapon" class="panel">G3</div>
<div id="health" class="panel">VIDA 100 ❤️</div>
<div id="cross">+</div>
<div id="joy"><div id="stick"></div></div>
<button class="btn" id="fire">✹<br>ATIRAR</button>
<button class="btn" id="jump">↟<br>PULAR</button>
<button class="btn" id="crouch">▣<br>AGACHAR</button>
<button class="btn" id="reload">⟳<br>RECARREGAR</button>
<button class="btn" id="aim">⌖<br>MIRAR</button>
<button class="btn" id="switch">TROCAR</button>
<button id="edit">AJUSTAR HUD</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c8dd);
scene.fog=new THREE.Fog(0x91c8dd,55,150);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,300);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.querySelector('#game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc5edff,0x405638,2));

const sun=new THREE.DirectionalLight(0xffe8b2,2.3);
sun.position.set(-30,60,30);
sun.castShadow=true;
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c});

const green=material(0x367c42);
const leaf=material(0x21623a);
const wood=material(0x795034);
const wall=material(0xd6b88b);
const roof=material(0xa64e32);
const skin=material(0xd3a17d);
const dark=material(0x252b2d);

function cube(x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 scene.add(o);
 return o;
}

// Ilha e praia
const ground=new THREE.Mesh(
 new THREE.CircleGeometry(95,64),green);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.2;
scene.add(ground);

const ocean=new THREE.Mesh(
 new THREE.CircleGeometry(210,64),
 material(0x087d9e));
ocean.rotation.x=-Math.PI/2;
ocean.position.y=-.5;
scene.add(ocean);

const beach=new THREE.Mesh(
 new THREE.RingGeometry(78,91,64),
 material(0xdcc58c));
beach.rotation.x=-Math.PI/2;
beach.position.y=-.12;
scene.add(beach);

// Palmeiras
function tree(x,z){
 const trunk=new THREE.Mesh(
 new THREE.CylinderGeometry(.2,.35,3,7),wood);
 trunk.position.set(x,1.5,z);
 scene.add(trunk);

 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;
  const crown=new THREE.Mesh(
   new THREE.ConeGeometry(.65,3,6),leaf);
  crown.position.set(
   x+Math.cos(a),3.2,z+Math.sin(a));
  crown.rotation.z=-Math.cos(a)*.6;
  scene.add(crown);
 }
}

// Casas
function house(x,z){
 cube(x,1.5,z,6,3,5,wall);
 const r=new THREE.Mesh(
  new THREE.ConeGeometry(4.5,2.5,4),roof);
 r.position.set(x,4,z);
 r.rotation.y=Math.PI/4;
 scene.add(r);
 cube(x,1,z+2.55,1,2,.1,dark);
}

house(-12,-12);
house(5,-15);
house(17,4);
house(-18,8);
house(3,15);

for(let i=0;i<40;i++){
 const a=i*2.4;
 const r=18+(i%8)*7;
 tree(Math.cos(a)*r,Math.sin(a)*r);
}

// Personagem
const player=new THREE.Group();
scene.add(player);

let selected='ONL1NE';

function createCharacter(){
 player.clear();

 const clothes=material(
 selected==='MIKA'?0x24282c:0x485b45);
 const pants=material(0x66694a);

 function part(geometry,mat,x,y,z){
  const o=new THREE.Mesh(geometry,mat);
  o.position.set(x,y,z);
  o.castShadow=true;
  player.add(o);
 }

 // Corpo
 part(new THREE.CapsuleGeometry(.42,.85,4,8),
 clothes,0,1.45,0);

 // Cabeça
 part(new THREE.SphereGeometry(.32,12,12),
 skin,0,2.35,0);

 // Cabelo
 part(new THREE.SphereGeometry(.35,12,10),
 material(selected==='MIKA'?0x171923:0xb5b3a9),
 0,2.48,0);

 // Pernas
 for(const side of [-1,1]){
  part(new THREE.CapsuleGeometry(.18,.7,4,8),
  pants,side*.22,.55,0);
 }

 // Arma visual provisória
 part(new THREE.BoxGeometry(.16,.16,.9),
 dark,0,1.5,-.65);
}

createCharacter();
player.position.set(0,0,4);

// Alvos de treinamento
const targets=[];
for(let i=0;i<6;i++){
 const t=new THREE.Group();
 const body=new THREE.Mesh(
 new THREE.CylinderGeometry(.4,.45,1.5,8),
 material(0x9b4936));
 body.position.y=1;
 t.add(body);
 const head=new THREE.Mesh(
 new THREE.SphereGeometry(.3,10,10),
 skin);
 head.position.y=2;
 t.add(head);
 t.position.set(-18+i*7,0,-32);
 scene.add(t);
 targets.push(t);
}

// Seleção
document.querySelectorAll('.pick').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('.pick')
  .forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  selected=b.dataset.char;
  createCharacter();
 };
});

let started=false;
document.querySelector('#start').onclick=()=>{
 started=true;
 document.querySelector('#menu').style.display='none';
 document.querySelector('#hud').style.display='block';
};

// Armas
let weapon='G3';
const ammo={G3:30,DE:7};
const reserve={G3:120,DE:35};
let reloading=false;
let score=0;

function showAmmo(){
 document.querySelector('#ammo').textContent=
 `${ammo[weapon]} / ${reserve[weapon]}`;
 document.querySelector('#weapon').textContent=
 weapon==='G3'?'G3 · RIFLE':'DESERT EAGLE';
}

let audio;
function sound(frequency,duration){
 try{
  audio??=new AudioContext();
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.type='sawtooth';
  osc.frequency.value=frequency;
  gain.gain.value=.08;
  gain.gain.exponentialRampToValueAtTime(
   .001,audio.currentTime+duration);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+duration);
 }catch(e){}
}

function shoot(){
 if(!started||reloading)return;
 if(ammo[weapon]<=0)return;

 ammo[weapon]--;
 showAmmo();

 sound(weapon==='G3'?120:75,.12);

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 const ray=new THREE.Raycaster(
 camera.position,direction,0,60);

 const hits=ray.intersectObjects(targets,true);

 if(hits.length){
  const target=hits[0].object.parent;
  scene.remove(target);
  targets.splice(targets.indexOf(target),1);
  score++;
  document.querySelector('#score').textContent=
  '🔵 '+score+'   05:00   🔴 0';
 }
}

document.querySelector('#fire').onclick=shoot;

function reload(){
 if(reloading)return;
 const max=weapon==='G3'?30:7;
 if(ammo[weapon]>=max||reserve[weapon]<=0)return;
 reloading=true;
 sound(250,.15);

 setTimeout(()=>{
  const n=Math.min(max-ammo[weapon],reserve[weapon]);
  ammo[weapon]+=n;
  reserve[weapon]-=n;
  reloading=false;
  showAmmo();
 },1300);
}

document.querySelector('#reload').onclick=reload;

document.querySelector('#switch').onclick=()=>{
 weapon=weapon==='G3'?'DE':'G3';
 showAmmo();
};

// Pular e agachar
let vertical=0,grounded=true,crouched=false;

document.querySelector('#jump').onclick=()=>{
 if(grounded){
  vertical=7;
  grounded=false;
 }
};

document.querySelector('#crouch').onclick=()=>{
 crouched=!crouched;
 player.scale.y=crouched?.75:1;
};

// Mira
let aiming=false;
document.querySelector('#aim').onclick=()=>{
 aiming=!aiming;
 camera.fov=aiming?42:65;
 camera.updateProjectionMatrix();
};

// Joystick
const joy=document.querySelector('#joy');
const stick=document.querySelector('#stick');
let moveX=0,moveY=0,joyActive=false;

joy.onpointerdown=e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
};
joy.onpointermove=e=>{
 if(joyActive)moveJoy(e);
};
function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const d=Math.hypot(x,y);
 if(d>42){x*=42/d;y*=42/d;}
 moveX=x/42;
 moveY=y/42;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function stopJoy(){
 joyActive=false;
 moveX=moveY=0;
 stick.style.transform='translate(0,0)';
}
joy.onpointerup=stopJoy;
joy.onpointercancel=stopJoy;

// Teclado
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')document.querySelector('#jump').click();
 if(e.key.toLowerCase()==='r')reload();
 if(e.key.toLowerCase()==='q')document.querySelector('#switch').click();
 if(e.key.toLowerCase()==='f')shoot();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Girar câmera com mouse ou toque na área do jogo
let yaw=0,pitch=.12;
let look=null;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  look={x:e.clientX,y:e.clientY};
  renderer.domElement.setPointerCapture(e.pointerId);
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(look){
  yaw-=(e.clientX-look.x)*.004;
  pitch=THREE.MathUtils.clamp(
   pitch+(e.clientY-look.y)*.003,-.3,.7);
  look={x:e.clientX,y:e.clientY};
 }
});
renderer.domElement.addEventListener('pointerup',()=>look=null);

let touchLook=null;
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.target.closest('#hud'))return;
 const t=e.changedTouches[0];
 touchLook={x:t.clientX,y:t.clientY};
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(!touchLook||e.target.closest('#hud'))return;
 const t=e.changedTouches[0];
 yaw-=(t.clientX-touchLook.x)*.006;
 pitch=THREE.MathUtils.clamp(
 pitch+(t.clientY-touchLook.y)*.003,-.3,.7);
 touchLook={x:t.clientX,y:t.clientY};
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>touchLook=null);

// Reposicionar HUD
let editing=false;
document.querySelector('#edit').onclick=()=>{
 editing=!editing;
 document.querySelector('#hud').classList.toggle(
 'editing',editing);
};
document.querySelectorAll('.btn').forEach(b=>{
 let drag=null;
 b.addEventListener('pointerdown',e=>{
  if(!editing)return;
  drag={x:e.clientX,y:e.clientY,
  left:b.getBoundingClientRect().left,
  top:b.getBoundingClientRect().top};
  b.setPointerCapture(e.pointerId);
 });
 b.addEventListener('pointermove',e=>{
  if(!drag)return;
  b.style.left=drag.left+e.clientX-drag.x+'px';
  b.style.top=drag.top+e.clientY-drag.y+'px';
  b.style.right='auto';
  b.style.bottom='auto';
 });
 b.addEventListener('pointerup',()=>drag=null);
});

// Loop 3D
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(started){
  let forward=
   (keys.w||keys.arrowup?-1:0)+
   (keys.s||keys.arrowdown?1:0)+moveY;
  let side=
   (keys.d||keys.arrowright?1:0)-
   (keys.a||keys.arrowleft?1:0)+moveX;

  const len=Math.hypot(forward,side);
  if(len>1){forward/=len;side/=len;}

  const speed=crouched?2:5;
  player.position.x+=
   (-Math.sin(yaw)*forward+
    Math.cos(yaw)*side)*speed*dt;
  player.position.z+=
   (-Math.cos(yaw)*forward-
    Math.sin(yaw)*side)*speed*dt;

  vertical-=18*dt;
  player.position.y+=vertical*dt;
  if(player.position.y<=0){
   player.position.y=0;
   vertical=0;
   grounded=true;
  }

  player.rotation.y=yaw;

  const target=new THREE.Vector3(
   player.position.x,
   player.position.y+1.5,
   player.position.z);

  const distance=aiming?4:7;
  const offset=new THREE.Vector3(
   Math.sin(yaw)*distance,
   2.5+pitch*2,
   Math.cos(yaw)*distance);

  camera.position.lerp(target.clone().add(offset),.15);
  camera.lookAt(target);
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
showAmmo();
</script>
</body>
</html>
